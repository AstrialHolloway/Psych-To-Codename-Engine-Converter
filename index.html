<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psych → Codename Engine Converter v1.0.3</title>
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Psych → Codename Engine Converter v1.0.3">
  <meta property="og:description" content="Convert your Psych Engine stage files to Codename Engine XML format with organized layers. Upload JSON and LUA files to get started.">
  <meta property="og:image" content="https://files.catbox.moe/8kzuby.png">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Psych → Codename Engine Converter">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Psych → Codename Engine Converter">
  <meta name="twitter:description" content="Convert your Psych Engine stage files to Codename Engine XML format with organized layers.">
  <meta name="twitter:image" content="https://files.catbox.moe/8kzuby.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>🎵 Psych → Codename Engine Converter</h1>

    <div class="file-input-wrapper">
      <input type="file" id="jsonInput" accept=".json" class="file-input">
      <label for="jsonInput" class="file-input-label" id="jsonLabel">
        📁 Select Stage JSON file (Required)
      </label>
    </div>

    <div class="file-input-wrapper">
      <input type="file" id="luaInput" accept=".lua" class="file-input">
      <label for="luaInput" class="file-input-label" id="luaLabel">
        📜 Select Stage LUA file (Required)
      </label>
    </div>

    <div class="status" id="status"></div>

    <div class="button-group">
      <button onclick="convert()" id="convertBtn" disabled>✨ Convert to Codename</button>
      <button onclick="download()" id="downloadBtn" disabled>💾 Download XML</button>
    </div>

    <textarea id="output" placeholder="🚀 Your converted .xml file with organized layers will appear here...

💡 Upload both files (JSON and LUA) to start conversion"></textarea>
    
    <div style="text-align: center; margin-top: 1rem; opacity: 0.7; font-size: 0.9rem;">
      <div>Created by <span style="color: #e94560; font-weight: 700;">OranGy</span></div>
      <div>Edited by <span style="color: #e94560; font-weight: 700;">Astrial</span></div>
      <div>ERROR: <span style="color: #e94560; font-weight: 700;">Website not functional at the moment!</span></div>
    </div>
  </div>

  <audio id="clickSound" preload="auto">
    <source src="/mouse-click-290204.mp3" type="audio/mpeg">
  </audio>

  <audio id="elevatorMusic" preload="auto" loop>
    <source src="/Elevator Music.mp3" type="audio/mpeg">
  </audio>

  <script>
    let jsonContent = null;
    let luaContent = null;
    let stageName = "stage_codename";
    let musicPlaying = false;

    // Start background music immediately
    window.addEventListener('load', function() {
      const elevatorMusic = document.getElementById('elevatorMusic');
      elevatorMusic.volume = 0.2;
      elevatorMusic.play().catch(() => {
        // Auto-play might be blocked, music will start on first user interaction
      });
      musicPlaying = true;
    });

    function playSound() {
      const clickSound = document.getElementById('clickSound');
      clickSound.currentTime = 0;
      clickSound.play();
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status ${type} show`;
      setTimeout(() => {
        status.classList.remove('show');
      }, 3000);
    }

    function updateButtons() {
      const convertBtn = document.getElementById('convertBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const hasFiles = jsonContent && luaContent;
      const hasOutput = document.getElementById('output').value.trim();
      
      convertBtn.disabled = !hasFiles;
      downloadBtn.disabled = !hasOutput;
    }

    document.getElementById('jsonInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const label = document.getElementById('jsonLabel');
      
      if (file) {
        stageName = file.name.replace(/\.[^/.]+$/, "");
        label.textContent = `✅ ${file.name}`;
        label.classList.add('has-file');
        playSound();
        
        const reader = new FileReader();
        reader.onload = () => {
          try {
            jsonContent = JSON.parse(reader.result);
            showStatus('✅ JSON file loaded successfully', 'success');
            updateButtons();
          } catch (error) {
            showStatus('❌ Error reading JSON file', 'error');
            jsonContent = null;
            updateButtons();
          }
        };
        reader.readAsText(file);
      }
    });

    document.getElementById('luaInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const label = document.getElementById('luaLabel');
      
      if (file) {
        if (!stageName || stageName === "stage_codename") {
          stageName = file.name.replace(/\.[^/.]+$/, "");
        }
        label.textContent = `✅ ${file.name}`;
        label.classList.add('has-file');
        playSound();
        
        const reader = new FileReader();
        reader.onload = () => {
          luaContent = reader.result;
          showStatus('✅ LUA file loaded successfully', 'success');
          updateButtons();
        };
        reader.readAsText(file);
      }
    });

    function extractSpritesFromLua(luaText) {
      const regex = /makeLuaSprite\(['"](\w+)['"],\s*['"]([^'"]+)['"],\s*(-?\d+),\s*(-?\d+)/g;
      const scaleRegex = /scaleObject\(['"](\w+)['"],\s*([\d.]+),\s*([\d.]+)\)/g;
      const scrollRegex = /setScrollFactor\(['"](\w+)['"],\s*([\d.]+),\s*([\d.]+)\)/g;

      const sprites = [];
      const scales = {};
      const scrolls = {};

      for (const match of luaText.matchAll(scaleRegex)) {
        scales[match[1]] = `${match[2]},${match[3]}`;
      }
      for (const match of luaText.matchAll(scrollRegex)) {
        scrolls[match[1]] = `${match[2]},${match[3]}`;
      }

      let index = 0;
      for (const match of luaText.matchAll(regex)) {
        const name = match[1];
        const path = match[2];
        const x = match[3];
        const y = match[4];
        const scale = scales[name] || "1,1";
        const scroll = scrolls[name] || "1,1";
        let layer = "mid";

        if (index < 3) layer = "bg";
        else if (index > 5) layer = "fg";

        sprites.push({ line: `<sprite sprite="${path}" name="${name}" x="${x}" y="${y}" scale="${scale}" scroll="${scroll}" layer="${layer}"/>`, updateHitbox="true", order: index, layer });
        index++;
      }

      return sprites;
    }

    function convert() {
      if (!jsonContent || !luaContent) {
        showStatus('❌ Missing files for conversion', 'error');
        return;
      }

      playSound();
      // charscale
      const charScales = {
        bf: "1.0",
        gf: "1.0",
        dad: "1.0"
      };

      const charScaleRegex = /scaleObject\(['"](bf|gf|dad)['"],\s*([\d.]+),\s*([\d.]+)\)/g;
      for (const match of luaContent.matchAll(charScaleRegex)) {
        const char = match[1];
        const scaleX = parseFloat(match[2]).toFixed(2);
        // const scaleY = parseFloat(match[3]).toFixed(2); ← ignorado
        charScales[char] = scaleX; // Usamos solo el X para Codename
      }
      
      // Don't restart music during conversion, let it play continuously
      const elevatorMusic = document.getElementById('elevatorMusic');
      if (!musicPlaying) {
        elevatorMusic.volume = 0.2;
        elevatorMusic.play();
        musicPlaying = true;
      }

      // Simulate processing time for dramatic effect
      setTimeout(() => {
        const zoom = jsonContent.defaultZoom || 1.0;
        const scrollspeed = jsonContent.camera_speed || 1.0;
        const bfPos = jsonContent.boyfriend || [0,0];
        const gfPos = jsonContent.girlfriend || [0,0];
        const dadPos = jsonContent.opponent || [0,0];

        const sprites = extractSpritesFromLua(luaContent);

        // Organizar por capa
        const layers = {
          bg: [],
          mid: [],
          fg: [],
          chars: []
        };

        for (const s of sprites) {
          if (layers[s.layer]) layers[s.layer].push(s.line);
          else layers.mid.push(s.line);
        }

        layers.chars.push(`<gf x="${gfPos[0]}" y="${gfPos[1]}" scale="${charScales.gf}" scroll="1,1" layer="chars"/>`);
        layers.chars.push(`<dad x="${dadPos[0]}" y="${dadPos[1]}" scale="${charScales.dad}" scroll="1,1" layer="chars"/>`);
        layers.chars.push(`<bf x="${bfPos[0]}" y="${bfPos[1]}" scale="${charScales.bf}" scroll="1,1" layer="chars"/>`);

        const xml = `<!DOCTYPE codename-engine-stage>
<stage zoom="${zoom}">
\t<layer name="bg"/>
\t<layer name="mid"/>
\t<layer name="fg"/>
\t<layer name="chars"/>

\t<combo/>
\t${layers.bg.join("\n\t")}
\t${layers.mid.join("\n\t")}
\t${layers.fg.join("\n\t")}
\t${layers.chars.join("\n\t")}
</stage>`;

        document.getElementById("output").value = xml;
        showStatus('🎉 Conversion completed successfully!', 'success');
        updateButtons();
        
        // Don't stop music, let it continue playing
      }, 1500);
    }

    function download() {
      const text = document.getElementById("output").value;
      if (!text.trim()) {
        showStatus('❌ No content to download', 'error');
        return;
      }
      
      playSound();
      const blob = new Blob([text], { type: "application/xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = stageName + ".xml";
      a.click();
      
      showStatus('💾 File downloaded successfully!', 'success');
    }

    // Initialize button states
    updateButtons();
  </script>
</body>
</html>
